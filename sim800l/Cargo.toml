[package]
name = "sim800l"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Драйвер для GSM/GPRS модема SIM800L с поддержкой embedded-hal и async/await"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/sim800l"
keywords = ["embedded", "gsm", "sim800l", "no-std", "async"]
categories = ["embedded", "hardware-support"]

[features]
default = []
std = ["embedded-hal/std"]
tokio = ["tokio/full"]
linux = ["std", "serialport"]

[dependencies]
embedded-hal = "1.0"
heapless = "0.8"
nb = "1.1"

# Linux поддержка (только для std feature)
serialport = { version = "4.0", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
panic-halt = "0.2"

[profile.release]
opt-level = "s"     # Оптимизация по размеру для embedded
lto = true          # Link Time Optimization
codegen-units = 1   # Улучшенная оптимизация

[profile.dev]
opt-level = 1       # Базовая оптимизация в debug режиме
debug = true        # Отладочная информация
